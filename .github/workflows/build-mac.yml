name: Build macOS VST Installer

on:
  push:
    paths:
      - 'plugin/**'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Verify Plugin Source
        run: |
          if [ ! -d "plugin" ] || [ ! -f "plugin/CMakeLists.txt" ]; then
            echo "Error: No plugin source found in plugin/ folder."
            exit 1
          fi

      - name: Setup JUCE (8.0.14)
        run: |
          git clone --depth 1 --branch 8.0.14 https://github.com/juce-framework/JUCE.git JUCE-checkout

      - name: Setup Avid AAX SDK
        run: |
          echo "=== Setting up Avid AAX SDK ==="
          mkdir -p "${{ github.workspace }}/SDKs"
          curl -sL "https://github.com/falconeyec-creator/falcon-mac-builder/releases/download/pace-tools/aax-sdk-2-10-0.zip" -o /tmp/aax_sdk.zip
          unzip -q /tmp/aax_sdk.zip -d "${{ github.workspace }}/SDKs"
          rm -f /tmp/aax_sdk.zip

      - name: Normalize Plugin CMakeLists for macOS
        run: |
          python3 -c '
          import re, os
          cmake_file = "plugin/CMakeLists.txt"
          if os.path.exists(cmake_file):
              with open(cmake_file, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              # Replace hardcoded Windows JUCE subdirectory paths with ${JUCE_DIR}
              content = re.sub(
                  r"add_subdirectory\s*\(\s*[\"\x27][^\"\x27]*JUCE[^\"\x27]*[\"\x27][^\)]*\)",
                  "if (DEFINED JUCE_DIR)\n    add_subdirectory(${JUCE_DIR} ${CMAKE_BINARY_DIR}/JUCE)\nendif()",
                  content,
                  flags=re.IGNORECASE
              )

              # Ensure FORMATS includes AU and AAX for Mac
              if "FORMATS" in content:
                  formats_match = re.search(r"FORMATS\s+([^\)\n]+)", content)
                  if formats_match:
                      raw_fmts = formats_match.group(1).split()
                      fmts = set(raw_fmts)
                      fmts.update(["VST3", "AU", "AAX", "Standalone"])
                      new_fmts = "FORMATS " + " ".join(sorted(fmts))
                      content = content.replace(formats_match.group(0), new_fmts)

              if "AU_SANDBOX_SAFE" not in content and "juce_add_plugin" in content:
                  content = re.sub(r"(juce_add_plugin\s*\([^\n]*)", r"\1\n    AU_SANDBOX_SAFE TRUE", content)

              with open(cmake_file, "w", encoding="utf-8") as f:
                  f.write(content)
              print("=== Normalized CMakeLists.txt for macOS ===")
          '

      - name: Configure CMake
        run: |
          cmake -S plugin -B build -G Xcode \
            -DJUCE_DIR="${{ github.workspace }}/JUCE-checkout" \
            -DJUCE_GLOBAL_AAX_SDK_PATH="${{ github.workspace }}/SDKs/aax-sdk-2-10-0" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build Universal Binary (Release)
        run: |
          cmake --build build --config Release -- -quiet

      - name: Setup PACE AAX Code Signing SDK & Sign AAX Plugin
        env:
          PACE_ACCOUNT: ${{ secrets.PACE_ACCOUNT }}
          PACE_PASSWORD: ${{ secrets.PACE_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_CUSTOMER_NUMBER: ${{ secrets.PACE_CUSTOMER_NUMBER }}
          PACE_CUSTOMER_NAME: ${{ secrets.PACE_CUSTOMER_NAME }}
          PACE_PFX_BASE64: ${{ secrets.PACE_PFX_BASE64 }}
        run: |
          set -e
          AAX_PATH=$(find build -type d -name "*.aaxplugin" | head -n1)
          if [ -z "$AAX_PATH" ]; then
            echo "No .aaxplugin found in build. Skipping PACE signing."
            exit 0
          fi

          echo "Found AAX Plugin to sign: $AAX_PATH"

          # 1. Download and Mount PACE AAX SDK for macOS from repo release
          echo "Downloading PACE Code Signing SDK for macOS..."
          curl -sL "https://github.com/falconeyec-creator/falcon-mac-builder/releases/download/pace-tools/PACECodeSigningForAAXSDKMac_v6.0.2_7088da2ca3.dmg" -o /tmp/pace_sdk.dmg
          
          echo "Mounting PACE SDK DMG..."
          hdiutil attach /tmp/pace_sdk.dmg -mountpoint /Volumes/PACE_SDK -nobrowse
          
          PKG=$(find /Volumes/PACE_SDK -name "*.pkg" | head -n1)
          if [ -n "$PKG" ]; then
            echo "Installing PACE SDK package: $PKG..."
            sudo installer -pkg "$PKG" -target /
          fi
          
          hdiutil detach /Volumes/PACE_SDK || true
          rm -f /tmp/pace_sdk.dmg

          # Locate wraptool and iloktool
          WRAPTOOL=$(find /Applications/PACEAntiPiracy /Library/Application\ Support/PACEAntiPiracy /usr/local/bin -name "wraptool" -type f 2>/dev/null | head -n1)
          if [ -z "$WRAPTOOL" ]; then
            WRAPTOOL=$(find / -name "wraptool" -type f 2>/dev/null | head -n1)
          fi
          echo "Found wraptool: $WRAPTOOL"

          ILOKTOOL=$(find /Applications/iLok\ License\ Manager.app /Applications/PACEAntiPiracy /usr/local/bin -name "iloktool" -type f 2>/dev/null | head -n1)
          if [ -z "$ILOKTOOL" ]; then
            ILOKTOOL=$(find / -name "iloktool" -type f 2>/dev/null | head -n1)
          fi
          echo "Found iloktool: $ILOKTOOL"

          if [ -n "$WRAPTOOL" ] && [ -n "$PACE_PASSWORD" ]; then
            # Set PACE_FUSION_HOME
            WRAPTOOL_DIR=$(dirname "$WRAPTOOL")
            FUSION_DIR=$(dirname "$WRAPTOOL_DIR")
            export PACE_FUSION_HOME="$FUSION_DIR"
            echo "Set PACE_FUSION_HOME=$PACE_FUSION_HOME"

            # 2. Setup Temporary Keychain & Import Falcon Eye Corporation Certificate
            KEYCHAIN="/tmp/build.keychain"
            KC_PASS="falcon2026"
            security create-keychain -p "$KC_PASS" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
            security set-keychain-settings -t 3600 -u "$KEYCHAIN"

            if [ -n "$PACE_PFX_BASE64" ]; then
              echo "$PACE_PFX_BASE64" | base64 -D > /tmp/falcon.pfx 2>/dev/null || echo "$PACE_PFX_BASE64" | base64 -d > /tmp/falcon.pfx
              security import /tmp/falcon.pfx -k "$KEYCHAIN" -P "falcon2026" -T /usr/bin/codesign -T "$WRAPTOOL"
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" 2>/dev/null || true
            fi

            # 3. Open iLok Cloud Session if iloktool is present
            if [ -n "$ILOKTOOL" ]; then
              echo "Opening iLok Cloud session for $PACE_ACCOUNT..."
              "$ILOKTOOL" cloud --open --account "$PACE_ACCOUNT" --password "$PACE_PASSWORD" -v || true
            fi

            # 4. Sign with wraptool using PACE WCGUID
            echo "Signing AAX Plugin with wraptool (PACE Eden AAX Code Signing)..."
            echo "Wrap Configuration GUID: $PACE_WCGUID"

            SIGN_SUCCESS=false
            if [ -n "$PACE_WCGUID" ]; then
              echo "Attempting wraptool sign with WCGUID and signid..."
              if "$WRAPTOOL" sign --verbose \
                --account "$PACE_ACCOUNT" \
                --password "$PACE_PASSWORD" \
                --wcguid "$PACE_WCGUID" \
                --signid "Falcon Eye Corporation" \
                --keychain "$KEYCHAIN" \
                --in "$AAX_PATH" \
                --out "$AAX_PATH" \
                --allowsigningservice; then
                SIGN_SUCCESS=true
              else
                echo "Retrying wraptool sign with WCGUID (omitting signid)..."
                if "$WRAPTOOL" sign --verbose \
                  --account "$PACE_ACCOUNT" \
                  --password "$PACE_PASSWORD" \
                  --wcguid "$PACE_WCGUID" \
                  --in "$AAX_PATH" \
                  --out "$AAX_PATH" \
                  --allowsigningservice; then
                  SIGN_SUCCESS=true
                fi
              fi
            fi

            if [ "$SIGN_SUCCESS" != "true" ] && [ -n "$PACE_CUSTOMER_NUMBER" ]; then
              echo "Fallback: Attempting wraptool sign with customernumber..."
              "$WRAPTOOL" sign --verbose \
                --account "$PACE_ACCOUNT" \
                --password "$PACE_PASSWORD" \
                --customernumber "$PACE_CUSTOMER_NUMBER" \
                --customername "$PACE_CUSTOMER_NAME" \
                --signid "Falcon Eye Corporation" \
                --keychain "$KEYCHAIN" \
                --in "$AAX_PATH" \
                --out "$AAX_PATH" \
                --allowsigningservice || true
            fi

            # 5. Verify the signature
            echo "Verifying AAX signature..."
            if "$WRAPTOOL" verify --in "$AAX_PATH"; then
              echo "SUCCESS: Official PACE Eden AAX Signature Verified!"
              touch /tmp/aax_signed_by_wraptool
            else
              echo "WARNING: PACE Eden signature verification did not pass."
            fi
          fi

      - name: Package macOS Installer (.pkg)
        run: |
          set -e
          mkdir -p out
          VST3_PATH=$(find build -type d -name "*.vst3" | head -n1)
          if [ -z "$VST3_PATH" ]; then
            echo "Error: No .vst3 produced during build!"
            exit 1
          fi

          PROJECT="$(basename "$VST3_PATH" .vst3)"
          echo "Packaging project: $PROJECT"

          # Clean identifier (NO SPACES, alphanumeric only - prevents Installer JavaScriptError)
          SAFE_ID=$(echo "$PROJECT" | tr -dc '[:alnum:]' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SAFE_ID" ]; then SAFE_ID="plugin"; fi
          PKG_ID="com.falconeye.${SAFE_ID}.pkg"
          echo "Using sanitized package identifier: $PKG_ID"

          # Ad-hoc sign binaries for Apple Silicon M1/M2/M3/M4 kernel compatibility
          codesign --force --deep --sign - "$VST3_PATH" || true

          APP_PATH=$(find build -type d -name "*.app" -path "*Standalone*" | head -n1)
          if [ -n "$APP_PATH" ]; then
            echo "Found Standalone App: $APP_PATH"
            codesign --force --deep --sign - "$APP_PATH" || true
          fi

          AU_PATH=$(find build -type d -name "*.component" | head -n1)
          if [ -n "$AU_PATH" ]; then
            echo "Found AU Component (Logic Pro / GarageBand): $AU_PATH"
            codesign --force --deep --sign - "$AU_PATH" || true
          fi

          AAX_PATH=$(find build -type d -name "*.aaxplugin" | head -n1)
          if [ -n "$AAX_PATH" ]; then
            echo "Found AAX Plugin (Avid Pro Tools): $AAX_PATH"
            if [ ! -f /tmp/aax_signed_by_wraptool ]; then
              echo "Applying fallback ad-hoc codesign to AAX..."
              codesign --force --deep --sign - "$AAX_PATH" || true
            else
              echo "AAX Plugin is already digitally signed with PACE Eden SDK. Preserving signature."
            fi
          fi

          # Prepare unified installation payload root
          rm -rf pkgroot
          mkdir -p "pkgroot/Library/Audio/Plug-Ins/VST3"
          cp -R "$VST3_PATH" "pkgroot/Library/Audio/Plug-Ins/VST3/"

          if [ -n "$AU_PATH" ]; then
            mkdir -p "pkgroot/Library/Audio/Plug-Ins/Components"
            cp -R "$AU_PATH" "pkgroot/Library/Audio/Plug-Ins/Components/"
          fi

          if [ -n "$APP_PATH" ]; then
            mkdir -p "pkgroot/Applications"
            cp -R "$APP_PATH" "pkgroot/Applications/"
          fi

          if [ -n "$AAX_PATH" ]; then
            mkdir -p "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins"
            cp -R "$AAX_PATH" "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins/"
          fi

          # Prepare postinstall script to strip quarantine and force AudioComponentRegistrar reload for Logic Pro
          mkdir -p pkgscripts
          printf '#!/bin/bash\nset -e\nxattr -cr "/Library/Audio/Plug-Ins/Components" 2>/dev/null || true\nxattr -cr "/Library/Audio/Plug-Ins/VST3" 2>/dev/null || true\nxattr -cr "/Library/Application Support/Avid/Audio/Plug-Ins" 2>/dev/null || true\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > pkgscripts/postinstall
          chmod +x pkgscripts/postinstall

          # Generate component plist and disable bundle relocation
          # (Prevents Spotlight bundle search failures during installation)
          pkgbuild --analyze --root pkgroot component.plist
          sed -i '' 's/<true\/>/<false\/>/g' component.plist || true

          # Build atomic component package with clean identifier, postinstall script, and no relocation
          pkgbuild --root pkgroot \
            --scripts pkgscripts \
            --component-plist component.plist \
            --identifier "$PKG_ID" \
            --version 1.0.0 \
            --install-location / \
            component.pkg

          # Build final macOS product installer
          productbuild --package component.pkg "out/${PROJECT} Setup.pkg"

          if [ -n "$AAX_PATH" ]; then
            zip -r "out/${PROJECT}_Mac.aaxplugin.zip" "$AAX_PATH"
          fi
          ls -la out

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: out/*
          if-no-files-found: error

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "Latest macOS VST Installer"
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
